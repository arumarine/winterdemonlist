<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Demonlist</title>
    <!-- Montserrat Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --text-color: #1e293b;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --accent-color: #0284c7;
            --sidebar-sub: #64748b;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --header-bg: #1e293b;
            --card-bg: #1e293b;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --sidebar-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* Top Header Bar */
        .header-bar {
            background: var(--header-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 40px;
            border-bottom: 2px solid var(--border-color);
            font-size: 13px;
            font-weight: 700;
        }

        .header-logo {
            color: var(--accent-color);
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .theme-toggle-btn:hover {
            border-color: var(--accent-color);
        }

        .auth-btn {
            background: var(--accent-color) !important;
            color: white !important;
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .auth-btn:hover {
            opacity: 0.9;
        }

        /* Main Container Layout */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            align-items: start;
        }

        /* Cards with Dotted Outlines */
        .card {
            background: var(--card-bg);
            border: 2px dotted var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        /* Level Item Card */
        .level-card {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .level-thumbnail {
            width: 210px;
            height: 115px;
            background: #0f172a;
            border-radius: 4px;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .level-info h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 6px;
        }

        .level-info p {
            font-size: 13px;
            color: var(--sidebar-sub);
            margin-bottom: 4px;
        }

        .level-info p a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .points {
            font-size: 12px;
            color: var(--sidebar-sub);
            margin-top: 6px;
        }

        /* Sidebar Styling */
        .sidebar-title {
            font-size: 17px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        .sidebar-subtitle {
            font-size: 11px;
            text-align: center;
            color: var(--sidebar-sub);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .sidebar hr {
            border: none;
            border-top: 1px dotted var(--border-color);
            margin-bottom: 15px;
        }

        .editor-list {
            list-style: none;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: var(--text-color);
        }

        /* Admin Controls */
        .admin-controls {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            gap: 5px;
        }

        body.logged-in .admin-controls {
            display: flex;
        }

        .btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 3px;
        }

        .btn-danger {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fca5a5;
        }

        body.dark-mode .btn-danger {
            background: #450a0a;
            color: #fca5a5;
            border-color: #7f1d1d;
        }

        .add-level-bar {
            display: none;
            margin-bottom: 20px;
        }

        body.logged-in .add-level-bar {
            display: block;
        }

        .add-btn {
            width: 100%;
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 10px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #0284c7;
        }

        /* Modal Dialog Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 30px;
            border-radius: 6px;
            width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .modal h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--sidebar-sub);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
        }

        .dropzone {
            border: 2px dashed var(--border-color);
            padding: 15px;
            text-align: center;
            border-radius: 4px;
            background: var(--bg-color);
            cursor: pointer;
            font-size: 12px;
            color: var(--sidebar-sub);
        }

        .preview-thumb {
            width: 100%;
            height: 90px;
            object-fit: cover;
            margin-top: 8px;
            border-radius: 2px;
            display: none;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background: var(--border-color);
            color: var(--text-color);
        }

        .btn-save {
            background: #10b981;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <div class="header-bar">
        <div class="header-logo">winter demonlist</div>
        <div class="header-right">
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleDarkMode()">☼</button>
            <button class="auth-btn" id="authBtn" onclick="toggleAuth()">🔒 Editor Login</button>
        </div>
    </div>

    <!-- Main Container Layout -->
    <div class="container">
        
        <!-- Add Level Button (Visible when logged in) -->
        <div class="add-level-bar">
            <button class="add-btn" onclick="openAddModal()">+ Add New Level</button>
        </div>

        <div class="content-grid">
            
            <!-- Left Side: Level List -->
            <div id="levelListContainer">
                <p style="text-align:center; padding: 20px;">Loading demonlist data...</p>
            </div>

            <!-- Right Side: Sidebar (List Editors) -->
            <div class="sidebar">
                <div class="card">
                    <div class="sidebar-title">List Editors</div>
                    <div class="sidebar-subtitle">Contact any of these people if you have problems with the list or want to see a specific thing changed.</div>
                    <hr>
                    <ul class="editor-list" id="editorListContainer">
                        <li>ARUMARINE</li>
                    </ul>
                </div>
            </div>

        </div>
    </div>

    <!-- Add / Edit Level Modal Dialog -->
    <div class="modal-overlay" id="levelModal">
        <div class="modal">
            <h3 id="modalTitle">Add New Level</h3>
            <input type="hidden" id="editIndex" value="-1">
            <div class="form-group">
                <label>Level Name</label>
                <input type="text" id="modalName" placeholder="e.g. Slaughterhouse">
            </div>
            <div class="form-group">
                <label>Publisher</label>
                <input type="text" id="modalPublisher" placeholder="e.g. icedcave">
            </div>
            <div class="form-group">
                <label>Points Text</label>
                <input type="text" id="modalPoints" value="35.00 (76%) — 350.00 (100%) points">
            </div>
            <div class="form-group" id="positionGroup" style="display:none;">
                <label>New Position (#)</label>
                <input type="number" id="modalPosition" min="1" placeholder="e.g. 2">
            </div>

            <!-- Thumbnail Input Options -->
            <div class="form-group">
                <label>YouTube Video Link (Auto-fetches Thumbnail)</label>
                <input type="text" id="modalYoutube" placeholder="https://www.youtube.com/watch?v=..." oninput="fetchYoutubeThumb()">
            </div>

            <div class="form-group">
                <label>Or Drop / Paste / Upload Image</label>
                <div class="dropzone" id="dropZone" ondragover="event.preventDefault()" ondrop="handleDrop(event)" onclick="document.getElementById('fileInput').click()" tabindex="0" onpaste="handlePaste(event)">
                    <span>📁 Click, Drag & Drop, or Press Ctrl+V to Paste Image</span>
                    <input type="file" id="fileInput" style="display:none" accept="image/*" onchange="handleFileSelect(event)">
                </div>
                <img id="imagePreview" class="preview-thumb" alt="Preview">
            </div>

            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn btn-save" id="saveBtn" onclick="saveLevelData()">Save Level</button>
            </div>
        </div>
    </div>

    <script>
        const GH_USERNAME = "arumarine";
        const GH_REPO = "winterdemonlist";
        const DATA_PATH = "data.json";

        let levels = [];
        let fileSha = "";
        let currentThumbData = "";
        let githubToken = localStorage.getItem('gh_admin_token') || "";

        window.onload = () => {
            if (githubToken) {
                document.body.classList.add('logged-in');
                document.getElementById('authBtn').innerText = "🔓 Logout";
            }
            if (localStorage.getItem('dark_mode') === 'true') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeToggleBtn').innerText = "☾";
            }
            fetchListData();
        };

        function toggleDarkMode() {
            let isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('dark_mode', isDark);
            document.getElementById('themeToggleBtn').innerText = isDark ? "☾" : "☼";
        }

        async function fetchListData() {
            try {
                const timestamp = new Date().getTime();
                const res = await fetch(`https://raw.githubusercontent.com/${GH_USERNAME}/${GH_REPO}/main/${DATA_PATH}?_t=${timestamp}`, {
                    cache: "no-store"
                });
                if (!res.ok) throw new Error("Could not find data.json");
                levels = await res.json();
                
                const metaRes = await fetch(`https://api.github.com/repos/${GH_USERNAME}/${GH_REPO}/contents/${DATA_PATH}?_t=${timestamp}`, {
                    cache: "no-store"
                });
                const metaData = await metaRes.json();
                fileSha = metaData.sha;

                render();
            } catch (e) {
                document.getElementById('levelListContainer').innerHTML = `<p style="color:red; text-align:center;">Failed to load data.json. Ensure file exists in your repository.</p>`;
            }
        }

        function render() {
            const container = document.getElementById('levelListContainer');
            container.innerHTML = '';
            
            if (levels.length === 0) {
                container.innerHTML = `<p style="text-align:center; padding: 20px; color: var(--sidebar-sub);">No levels found in the demonlist.</p>`;
                return;
            }

            levels.forEach((lvl, index) => {
                let thumbContent = lvl.thumb 
                    ? `<img src="${lvl.thumb}" class="level-thumbnail" style="object-fit:cover;">`
                    : `<div class="level-thumbnail" style="background: linear-gradient(135deg, #0f172a, #334155);">${lvl.name}</div>`;

                container.innerHTML += `
                    <div class="card level-card">
                        <div class="admin-controls">
                            <button class="btn" onclick="openEditModal(${index})">Edit</button>
                            <button class="btn btn-danger" onclick="deleteLevel(${index})">Delete</button>
                        </div>
                        ${thumbContent}
                        <div class="level-info">
                            <h2>#${index + 1} - ${lvl.name}</h2>
                            <p>published by <a href="#">${lvl.publisher}</a></p>
                            <div class="points">${lvl.points}</div>
                        </div>
                    </div>
                `;
            });
        }

        async function toggleAuth() {
            if (!githubToken) {
                let tokenInput = prompt("Enter your GitHub Personal Access Token:");
                if (!tokenInput) return;

                let res = await fetch("https://api.github.com/user", {
                    headers: { "Authorization": `token ${tokenInput.trim()}` }
                });

                if (res.ok) {
                    githubToken = tokenInput.trim();
                    localStorage.setItem('gh_admin_token', githubToken);
                    document.body.classList.add('logged-in');
                    document.getElementById('authBtn').innerText = "🔓 Logout";
                    alert("Token verified! Admin access granted.");
                } else {
                    alert("Invalid GitHub Token! Access denied.");
                }
            } else {
                localStorage.removeItem('gh_admin_token');
                githubToken = "";
                document.body.classList.remove('logged-in');
                document.getElementById('authBtn').innerText = "🔒 Editor Login";
                alert("Logged out of Editor mode.");
            }
        }

        async function commitToGitHub() {
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = "Saving to GitHub...";
            saveBtn.disabled = true;

            const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(levels, null, 2))));

            try {
                const res = await fetch(`https://api.github.com/repos/${GH_USERNAME}/${GH_REPO}/contents/${DATA_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${githubToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Update demonlist data",
                        content: contentEncoded,
                        sha: fileSha
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    fileSha = data.content.sha;
                    render();
                    closeModal();
                    alert("Demonlist successfully updated on GitHub!");
                } else {
                    alert("Error saving data. Make sure your GitHub Token has 'repo' permissions.");
                }
            } catch(e) {
                alert("Network error while connecting to GitHub.");
            } finally {
                saveBtn.innerText = "Save Level";
                saveBtn.disabled = false;
            }
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = "Add New Level";
            document.getElementById('editIndex').value = "-1";
            document.getElementById('modalName').value = "";
            document.getElementById('modalPublisher').value = "";
            document.getElementById('modalPoints').value = "35.00 (76%) — 350.00 (100%) points";
            document.getElementById('modalYoutube').value = "";
            document.getElementById('positionGroup').style.display = 'none';
            setThumbnail("");
            document.getElementById('levelModal').style.display = 'flex';
        }

        function openEditModal(index) {
            let lvl = levels[index];
            document.getElementById('modalTitle').innerText = "Edit Level #" + (index + 1);
            document.getElementById('editIndex').value = index;
            document.getElementById('modalName').value = lvl.name;
            document.getElementById('modalPublisher').value = lvl.publisher;
            document.getElementById('modalPoints').value = lvl.points;
            document.getElementById('modalYoutube').value = "";
            
            document.getElementById('positionGroup').style.display = 'block';
            document.getElementById('modalPosition').value = index + 1;

            setThumbnail(lvl.thumb || "");
            document.getElementById('levelModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('levelModal').style.display = 'none';
        }

        function setThumbnail(dataUrl) {
            currentThumbData = dataUrl;
            let preview = document.getElementById('imagePreview');
            if (dataUrl) {
                preview.src = dataUrl;
                preview.style.display = 'block';
            } else {
                preview.src = '';
                preview.style.display = 'none';
            }
        }

        function fetchYoutubeThumb() {
            let url = document.getElementById('modalYoutube').value.trim();
            let videoId = "";
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1]?.split('?')[0];
            } else if (url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1]?.split('&')[0];
            }
            if (videoId) {
                let thumbUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                setThumbnail(thumbUrl);
            }
        }

        function handleFileSelect(event) {
            let file = event.target.files[0];
            if (file) processFile(file);
        }

        function handleDrop(event) {
            event.preventDefault();
            let file = event.dataTransfer.files[0];
            if (file) processFile(file);
        }

        function handlePaste(event) {
            let items = (event.clipboardData || event.originalEvent.clipboardData).items;
            for (let index in items) {
                let item = items[index];
                if (item.kind === 'file') {
                    let file = item.getAsFile();
                    if (file) processFile(file);
                }
            }
        }

        function processFile(file) {
            let reader = new FileReader();
            reader.onload = function(e) {
                setThumbnail(e.target.result);
            }
            reader.readAsDataURL(file);
        }

        function saveLevelData() {
            let index = parseInt(document.getElementById('editIndex').value);
            let name = document.getElementById('modalName').value.trim();
            let publisher = document.getElementById('modalPublisher').value.trim();
            let points = document.getElementById('modalPoints').value.trim();

            if (!name) {
                alert("Please enter a level name.");
                return;
            }

            let levelData = {
                name: name,
                publisher: publisher || "Unknown",
                points: points,
                thumb: currentThumbData
            };

            if (index === -1) {
                levels.push(levelData);
            } else {
                let newPosInput = parseInt(document.getElementById('modalPosition').value);
                levels.splice(index, 1);
                let targetIndex = isNaN(newPosInput) ? index : Math.max(0, Math.min(levels.length, newPosInput - 1));
                levels.splice(targetIndex, 0, levelData);
            }

            commitToGitHub();
        }

        function deleteLevel(index) {
            if (confirm(`Are you sure you want to delete #${index + 1} - ${levels[index].name}?`)) {
                levels.splice(index, 1);
                commitToGitHub();
            }
        }
    </script>
</body>
</html>
